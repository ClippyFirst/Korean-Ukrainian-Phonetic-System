name: Deploy Korean–Ukrainian service to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} regression and data checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[dev,all]"
      - name: Run Python pipeline and data-integrity tests
        run: python -m pytest -q

  web-build:
    name: Browser tests and static build
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run browser regression tests
        run: npm test
      - name: Build both public pages
        run: npm run build
      - name: Verify both public pages are in the artifact
        run: test -f dist/index.html && test -f dist/system.html
      - name: Configure GitHub Pages metadata
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
