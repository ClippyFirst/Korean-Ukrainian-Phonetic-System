name: Deploy Korean–Ukrainian service to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} regression and data checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[dev,all]"
      - name: Validate research corpus in strict mode before deployment
        run: python scripts/generate_korean_corpus.py --strict
      - name: Run Python pipeline and data-integrity tests
        run: python -m pytest -q

  web-build:
    name: Browser tests and static build
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run browser regression tests
        run: npm test
      - name: Build both public pages
        run: npm run build
      - name: Verify both public pages are in the artifact
        run: test -f dist/index.html && test -f dist/system.html
      - name: Configure GitHub Pages metadata
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test the deployed public pages
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGES_URL%/}/"
          index_file="$(mktemp)"
          system_file="$(mktemp)"
          asset_file="$(mktemp)"
          curl --fail --location --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors --max-time 30 "$base_url" -o "$index_file"
          grep -Fq 'лише кілька точних виправлень корейської поверхневої форми, прямо підтверджених NIKL' "$index_file"
          grep -Fq 'id="mode-practical"' "$index_file"
          curl --fail --location --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors --max-time 30 "${base_url}system.html" -o "$system_file"
          grep -Fq '<title>Система / 한국어 → УКРАЇНСЬКА</title>' "$system_file"
          asset_path="$(grep -oE 'src="\./assets/[^"]+\.js"' "$index_file" | head -n 1 | cut -d '"' -f 2 | sed 's#^\./##')"
          test -n "$asset_path"
          curl --fail --location --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors --max-time 30 "${base_url}${asset_path}" -o "$asset_file"
          test -s "$asset_file"
          echo "Public Pages HTTP smoke passed for index.html, system.html, and the first JS asset at $base_url"
      - name: Check out source for live browser smoke
        uses: actions/checkout@v4
      - name: Set up Node.js for live browser smoke
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright without changing project manifests
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium for live browser smoke
        run: npx playwright install --with-deps chromium
      - name: Exercise live practical mode with adversarial Korean passage
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/smoke-live-pages-browser.mjs
