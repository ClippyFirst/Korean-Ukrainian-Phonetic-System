name: Recovered Korean holdout manifest integrity
on:
  pull_request:
    paths:
      - "data/korean/benchmarks/ipa-holdout-24-manifest.json"
      - "data/korean/benchmarks/target-renderer-holdout-24.csv"
      - "scripts/audit_holdout_manifest_recovery.py"
      - "tests/test_target_renderer_holdout_24.py"
      - ".github/workflows/holdout-manifest-recovery.yml"
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact original Git blob, ordered membership, and pending gold status
        run: python scripts/audit_holdout_manifest_recovery.py --output "$RUNNER_TEMP/holdout-manifest-integrity.json"
      - name: Run focused provenance regression
        run: python -m pip install -e ".[dev]" && python -m pytest -q tests/test_target_renderer_holdout_24.py
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-korean-holdout-manifest-integrity
          path: ${{ runner.temp }}/holdout-manifest-integrity.json
          if-no-files-found: error
