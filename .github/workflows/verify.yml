name: Verify Korean–Ukrainian system

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python regression and data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,all]"
      - name: Run Python tests
        run: python -m pytest -q

  web-tests:
    name: Browser regression tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run browser tests
        run: npm test
      - name: Build public pages
        run: npm run build
      - name: Verify generated pages
        run: test -f dist/index.html && test -f dist/system.html
