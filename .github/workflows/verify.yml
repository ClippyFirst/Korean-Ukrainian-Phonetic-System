name: Verify Korean–Ukrainian system

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python regression and data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,all]"
      - name: Run Python tests
        run: python -m pytest -q

  nikl-source-crawl:
    name: Official NIKL source inventory (metadata-only)
    if: startsWith(github.head_ref, 'research/nikl-') || startsWith(github.ref_name, 'research/nikl-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Crawl official article inventory
        id: live-crawl
        continue-on-error: true
        run: npm run crawl:nikl -- --output reports/nikl/ci-manifest.json 2>&1 | tee reports/nikl-live-crawl.log
      - name: Upload crawl evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikl-source-crawl-${{ github.run_id }}
          path: |
            reports/nikl-live-crawl.log
            reports/nikl/ci-manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce successful source inventory
        if: steps.live-crawl.outcome != 'success'
        run: |
          echo "The official NIKL source crawl failed or was blocked. Inspect the uploaded crawl log; do not bypass robots/access policy or accept a partial inventory."
          exit 1

  web-tests:
    name: Browser regression tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run browser tests
        run: npm test
      - name: Build public pages
        run: npm run build
      - name: Verify generated pages
        run: test -f dist/index.html && test -f dist/system.html
