name: Verify Korean–Ukrainian system

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python regression and data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,all]"
      - name: Run Python tests
        run: python -m pytest -q

  nikl-source-crawl:
    name: Official NIKL source inventory (metadata-only)
    if: startsWith(github.head_ref, 'research/nikl-') || startsWith(github.ref_name, 'research/nikl-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Crawl official article inventory
        id: live-crawl
        continue-on-error: true
        run: set -o pipefail; npm run crawl:nikl -- --output reports/nikl/ci-manifest.json 2>&1 | tee reports/nikl-live-crawl.log
      - name: Upload crawl evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikl-source-crawl-${{ github.run_id }}
          path: |
            reports/nikl-live-crawl.log
            reports/nikl/ci-manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Classify source-access blocks separately from collector defects
        if: steps.live-crawl.outcome != 'success'
        run: |
          if grep -q '^NIKL crawl BLOCKED:' reports/nikl-live-crawl.log; then
            echo "::warning::Official NIKL access is blocked in this runner. The failure is recorded as BLOCKED; no bypass will be attempted."
          else
            echo "Collector or inventory validation failed. Inspect the uploaded log; this is not an accepted crawl."
            exit 1
          fi

  web-tests:
    name: Browser regression tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run browser tests
        run: npm test
      - name: Build public pages
        run: npm run build
      - name: Verify generated pages
        run: test -f dist/index.html && test -f dist/system.html


  neural-korean-g2p:
    name: Pinned CharsiuG2P inference (research opt-in)
    if: github.head_ref == 'research/neural-korean-g2p-v3-2026-10-26' && contains(toJSON(github.event.pull_request.labels), 'enhancement')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HOME: ${{ runner.temp }}/huggingface-cache
      UGT_PHON_COMMIT: ef0d5a09c2ea1874c7206020f875cbd9cfea2f54
      SIGMORPHON_COMMIT: 821bcdece5a47820872215969f275004b0abe80c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned CPU inference and existing baseline dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.44.2" "sentencepiece==0.2.0" "huggingface_hub==0.24.6" "pytest==8.3.3"
          python -m pip install -e ".[g2pk]" "regex==2024.5.10" "phonemizer==3.3.0"

      - name: Run adapter unit tests
        run: python -m pytest tests/test_charsiu_g2p_benchmark.py tests/test_contextual_g2p_benchmark.py

      - name: Resolve immutable model and tokenizer revisions
        id: neural-revisions
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from huggingface_hub import HfApi
          api = HfApi()
          model = api.model_info("charsiu/g2p_multilingual_byT5_small_100", revision="ed5cf99")
          tokenizer = api.model_info("google/byt5-small", revision="68377bd")
          assert len(model.sha) == 40 and len(tokenizer.sha) == 40
          print("model_sha=" + model.sha)
          print("tokenizer_sha=" + tokenizer.sha)
          PY

      - name: Fetch and validate pinned UGTPHON Korean test split
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neural-results"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/naver-ai/UGTPHON/$UGT_PHON_COMMIT/ko/test.json" \
            --output "$RUNNER_TEMP/ko-test.json"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/naver-ai/UGTPHON/$UGT_PHON_COMMIT/ko/LICENSE" \
            --output "$RUNNER_TEMP/ko-LICENSE"
          grep -q "Apache License, Version 2.0" "$RUNNER_TEMP/ko-LICENSE"
          python - "$RUNNER_TEMP/ko-test.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert len(rows) == 275, f"UGTPHON row-count drift: {len(rows)}"
          assert all(row.get("lang") == "ko" and row.get("split") == "test" for row in rows)
          assert len({row["id"] for row in rows}) == len(rows)
          print(f"Validated UGTPHON Korean test split: {len(rows)} rows; Apache-2.0")
          PY

      - name: Run CharsiuG2P on UGTPHON and compare paired baselines
        env:
          MODEL_SHA: ${{ steps.neural-revisions.outputs.model_sha }}
          TOKENIZER_SHA: ${{ steps.neural-revisions.outputs.tokenizer_sha }}
        run: |
          set -euo pipefail
          python scripts/benchmark_charsiu_g2p.py \
            --corpus "$RUNNER_TEMP/ko-test.json" \
            --output "$RUNNER_TEMP/neural-results/charsiu-ugtphon.json" \
            --model charsiu/g2p_multilingual_byT5_small_100 --model-revision "$MODEL_SHA" \
            --tokenizer google/byt5-small --tokenizer-revision "$TOKENIZER_SHA" \
            --batch-size 8 --compare-existing-engines \
            | tee "$RUNNER_TEMP/neural-results/charsiu-ugtphon-summary.json"

      - name: Fetch and convert pinned SIGMORPHON Korean lexical test split
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/sigmorphon/2021-task1/$SIGMORPHON_COMMIT/data/medium/kor_test.tsv" \
            --output "$RUNNER_TEMP/sigmorphon-kor-test.tsv"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/sigmorphon/2021-task1/$SIGMORPHON_COMMIT/README.md" \
            --output "$RUNNER_TEMP/sigmorphon-README.md"
          grep -qi "Creative Commons Attribution-ShareAlike 3.0" "$RUNNER_TEMP/sigmorphon-README.md"
          python scripts/convert_sigmorphon_ko.py \
            --input "$RUNNER_TEMP/sigmorphon-kor-test.tsv" \
            --output "$RUNNER_TEMP/sigmorphon-kor-test.json" \
            --expected-rows 1000

      - name: Run CharsiuG2P on SIGMORPHON and compare paired baselines
        env:
          MODEL_SHA: ${{ steps.neural-revisions.outputs.model_sha }}
          TOKENIZER_SHA: ${{ steps.neural-revisions.outputs.tokenizer_sha }}
        run: |
          set -euo pipefail
          python scripts/benchmark_charsiu_g2p.py \
            --corpus "$RUNNER_TEMP/sigmorphon-kor-test.json" \
            --output "$RUNNER_TEMP/neural-results/charsiu-sigmorphon.json" \
            --model charsiu/g2p_multilingual_byT5_small_100 --model-revision "$MODEL_SHA" \
            --tokenizer google/byt5-small --tokenizer-revision "$TOKENIZER_SHA" \
            --batch-size 8 --compare-existing-engines \
            | tee "$RUNNER_TEMP/neural-results/charsiu-sigmorphon-summary.json"

      - name: Record model hashes, license status, and dataset provenance
        if: always()
        env:
          MODEL_SHA: ${{ steps.neural-revisions.outputs.model_sha }}
          TOKENIZER_SHA: ${{ steps.neural-revisions.outputs.tokenizer_sha }}
        run: |
          python - "$RUNNER_TEMP/neural-results/model-provenance.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          root = Path(os.environ["HF_HOME"]) / "hub"
          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(8 * 1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          model_sha, tokenizer_sha = os.getenv("MODEL_SHA", ""), os.getenv("TOKENIZER_SHA", "")
          model_dir = root / "models--charsiu--g2p_multilingual_byT5_small_100" / "snapshots" / model_sha
          tokenizer_dir = root / "models--google--byt5-small" / "snapshots" / tokenizer_sha
          files = []
          for base, candidates in (
              (model_dir, ["pytorch_model.bin", "config.json"]),
              (tokenizer_dir, ["tokenizer_config.json", "special_tokens_map.json", "spiece.model", "tokenizer.json"]),
          ):
              for name in candidates:
                  path = base / name
                  if path.is_file():
                      files.append({"path": name, "snapshot": base.name, "size_bytes": path.stat().st_size, "sha256": digest(path)})
          payload = {
              "schema_version": 1,
              "model": {"id": "charsiu/g2p_multilingual_byT5_small_100", "revision": model_sha,
                        "code_license": "MIT (upstream repository)", "weights_license_status": "UNRESOLVED: official model page has no explicit weights license; research-only, no redistribution"},
              "tokenizer": {"id": "google/byt5-small", "revision": tokenizer_sha, "license": "Apache-2.0"},
              "dependencies": {"python": "3.12", "torch": "2.4.1 CPU", "transformers": "4.44.2", "sentencepiece": "0.2.0", "huggingface_hub": "0.24.6"},
              "datasets": [
                {"id": "naver-ai/UGTPHON", "commit": "ef0d5a09c2ea1874c7206020f875cbd9cfea2f54", "file": "ko/test.json", "license": "Apache-2.0", "rows": 275, "evaluation": "word/token-level ablation; sentence context not preserved"},
                {"id": "sigmorphon/2021-task1", "commit": "821bcdece5a47820872215969f275004b0abe80c", "file": "data/medium/kor_test.tsv", "license": "CC BY-SA 3.0", "rows": 1000, "evaluation": "lexical word-level; not sentence-context evaluation"}
              ],
              "files": files,
              "artifact_policy": "Reports and raw predictions only; model weights and caches are not uploaded."
          }
          Path(sys.argv[1]).write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload neural per-case results and provenance (no weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-korean-g2p-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/neural-results/
          if-no-files-found: warn
          retention-days: 30
