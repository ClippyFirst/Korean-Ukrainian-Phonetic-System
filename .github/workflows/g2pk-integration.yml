name: Optional g2pK integration
on:
  pull_request:
    paths:
      - "src/korean_ukrainian/g2pk_engine.py"
      - "src/korean_ukrainian/api.py"
      - "src/korean_ukrainian/cli.py"
      - "src/korean_ukrainian/pipeline.py"
      - "pyproject.toml"
      - "data/korean/lexical_additions_2026-10-15-g2pk.csv"
      - "tests/test_g2pk_engine.py"
      - ".github/workflows/g2pk-integration.yml"
  workflow_dispatch:
jobs:
  g2pk-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,g2pk]"
      - run: python -m pytest tests/test_g2pk_engine.py
