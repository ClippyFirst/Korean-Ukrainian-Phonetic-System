name: Korean-to-Ukrainian external transcription smoke comparison

on:
  workflow_dispatch:
  push:
    branches:
      - "bench/extended-metrics-runtime-2026-10-29"
    paths:
      - ".github/workflows/korean-ukrainian-external-translit-smoke.yml"
  pull_request:
    paths:
      - ".github/workflows/korean-ukrainian-external-translit-smoke.yml"

permissions:
  contents: read

jobs:
  public-transcription-api:
    name: Exercise Hikka and Shchegel through the documented public API
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the native project package
        run: python -m pip install -e .

      - name: Query both public Korean-to-Ukrainian systems on the same diagnostic inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          from korean_ukrainian.pipeline import transliterate_korean

          endpoint = "https://api.mikai.me/public/v1/translit"
          items = [
              "한글", "안녕하세요", "독립문", "신라", "국립", "같이",
              "맞히다", "민주주의의 의의", "현대", "김치", "흙을",
              "밟으며", "낡은", "놓인", "맑은", "햇빛이", "젊은",
              "설날", "종로", "서울",
          ]
          reports = {}
          native_lines = []
          for item in items:
              started = time.perf_counter()
              try:
                  result = transliterate_korean(item)
                  output = result.get("ukrainian_orthography") or result.get("candidate_orthography") or ""
                  native_lines.append({
                      "source": item,
                      "result": output,
                      "target_status": result.get("target_status"),
                      "selection_status": result.get("selection_status"),
                      "ipa": result.get("ipa", {}).get("ipa") if isinstance(result.get("ipa"), dict) else result.get("ipa"),
                      "elapsed_ms": round((time.perf_counter() - started) * 1000, 3),
                  })
              except Exception as exc:
                  native_lines.append({"source": item, "result": "", "error": f"{type(exc).__name__}: {exc}"})
          reports["clippyfirst_native"] = {
              "system": "ClippyFirst native research pipeline",
              "input_count": len(items),
              "lines": native_lines,
              "available_targets": sum(bool(line.get("result")) for line in native_lines),
          }
          print(f"\\nSYSTEM=clippyfirst_native; inputs={len(items)}; available_targets={reports['clippyfirst_native']['available_targets']}")
          for line in native_lines:
              print(f"{line['source']}\\t{line.get('result', '')}\\t{line.get('target_status', line.get('error', ''))}")

          for system in ("hikka", "shchegel"):
              payload = json.dumps(
                  {"lang": "ko", "system": system, "mode": "text", "items": items},
                  ensure_ascii=False,
              ).encode("utf-8")
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "ClippyFirst-KoreanUkrainianBenchmark/0.1 (research smoke test)",
                  },
                  method="POST",
              )
              started = time.perf_counter()
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
                      body = json.loads(response.read().decode("utf-8"))
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"{system} API request failed: {type(exc).__name__}: {exc}") from exc
              elapsed_ms = (time.perf_counter() - started) * 1000
              if status != 200 or body.get("ok") is not True:
                  raise SystemExit(f"{system} API returned status={status}, body={body!r}")
              result = body.get("result", {})
              lines = result.get("lines")
              if not isinstance(lines, list) or len(lines) != len(items):
                  raise SystemExit(
                      f"{system} returned {len(lines) if isinstance(lines, list) else 'no'} "
                      f"lines for {len(items)} inputs"
                  )
              if [line.get("source") for line in lines] != items:
                  raise SystemExit(f"{system} API changed input order or source strings")
              reports[system] = {
                  "status": status,
                  "system": result.get("system"),
                  "elapsed_ms": round(elapsed_ms, 3),
                  "input_count": len(items),
                  "lines": lines,
              }
              print(f"\nSYSTEM={system}; label={result.get('system')}; inputs={len(items)}; wall_ms={elapsed_ms:.3f}")
              for line in lines:
                  print(f"{line['source']}\t{line.get('result', '')}")

          differences = [
              {
                  "source": item,
                  "hikka": next(line.get("result") for line in reports["hikka"]["lines"] if line["source"] == item),
                  "shchegel": next(line.get("result") for line in reports["shchegel"]["lines"] if line["source"] == item),
              }
              for item in items
          ]
          different = [row for row in differences if row["hikka"] != row["shchegel"]]
          native_by_source = {line["source"]: line for line in native_lines}
          native_differences = {
              system: [
                  {"source": item, "clippyfirst_native": native_by_source[item].get("result", ""), system: next(line.get("result") for line in reports[system]["lines"] if line["source"] == item),
                   "native_target_status": native_by_source[item].get("target_status"),
                   "native_selection_status": native_by_source[item].get("selection_status")}
                  for item in items
                  if native_by_source[item].get("result", "") != next(line.get("result") for line in reports[system]["lines"] if line["source"] == item)
              ] for system in ("hikka", "shchegel")
          }
          output = {
              "purpose": "API smoke test and same-input output comparison only; no adjudicated Ukrainian gold, no accuracy claim",
              "endpoint": endpoint,
              "inputs": items,
              "systems": reports,
              "difference_count": len(different),
              "different_outputs": different,
              "clippyfirst_native": reports["clippyfirst_native"],
              "native_vs_external_differences": native_differences,
              "native_vs_hikka_difference_count": len(native_differences["hikka"]),
              "native_vs_shchegel_difference_count": len(native_differences["shchegel"]),
          }
          Path("external-transcription-smoke-report.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"\nHikka/Shchegel outputs differ on {len(different)}/{len(items)} inputs.")
          print("This is not an accuracy ranking: no independent Ukrainian gold labels are included.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: korean-ukrainian-external-transcription-smoke
          path: external-transcription-smoke-report.json
          if-no-files-found: error
          retention-days: 14
