name: Browser and Python g2pK differential report

on:
  push:
    branches:
      - fix/g2pk-browser-parity-gate-2026-10-16
    paths:
      - scripts/compare-g2pk-engines.py
      - scripts/export-browser-g2pk-surfaces.mjs
      - tests/fixtures/g2pk-surface-regression.json
      - src/app/g2pk_web.js
      - src/vendor/g2pk/**
      - data/korean/lexical_pronunciations.csv
      - data/korean/lexical_additions_2026-10-15.csv
  pull_request:
    paths:
      - scripts/compare-g2pk-engines.py
      - scripts/export-browser-g2pk-surfaces.mjs
      - tests/fixtures/g2pk-surface-regression.json
      - src/app/g2pk_web.js
      - src/vendor/g2pk/**
      - data/korean/lexical_pronunciations.csv
      - data/korean/lexical_additions_2026-10-15.csv
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install JavaScript dependencies
        run: npm install
      - name: Install Python g2pK reference engine
        run: python -m pip install -e '.[g2pk]'
      - name: Compare surface forms
        run: python scripts/compare-g2pk-engines.py --output g2pk-differential-report-${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: g2pk-differential-report-${{ matrix.python-version }}
          path: g2pk-differential-report-${{ matrix.python-version }}.json
          if-no-files-found: error
