name: tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,all]"
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Verify IPA target data in a clean wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/korean-ua-wheel"
          "$RUNNER_TEMP/korean-ua-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/korean-ua-wheel/bin/python" -c "from korean_ukrainian.ipa_target_renderer import render_ipa_sequence_to_ukrainian as render; a=render('k.a'); strict=render('kʰjʌ'); b=render('kʰjʌ', allow_provisional=True); assert a['ukrainian_orthography']=='ка' and len(a['segments'])==2; assert strict['ukrainian_orthography'] is None and strict['reason']=='provisional_mapping_requires_review'; assert b['ukrainian_orthography']=='к\'хьо' and b['status']=='provisional'; print('wheel IPA target data OK')"
          "$RUNNER_TEMP/korean-ua-wheel/bin/python" -c "from korean_ukrainian.rule_plan import default_rule_ids; from korean_ukrainian.rules import apply_ordered_rules; from korean_ukrainian.phonology import parse_syllables; expected=('R009','R003','R002','R004','R006','R005','R007','R010','R011','R012','R013','R014','R015','R016','R008','R001'); assert default_rule_ids()==expected; _, traces=apply_ordered_rules(parse_syllables('가나다')); assert tuple(t.rule_id for t in traces)==expected; print('wheel deterministic rule plan OK')"

  teacher-corpus-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Unit-test pinned corpus parsers and overlap logic
        run: python -m pytest -q tests/test_audit_teacher_corpus_splits.py
      - name: Verify source pins and audit Korean train/dev/test overlaps
        run: python scripts/audit_teacher_corpus_splits.py --output-json "$RUNNER_TEMP/teacher-corpus-split-audit.json"
      - name: Upload metadata-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: teacher-corpus-split-audit
          path: ${{ runner.temp }}/teacher-corpus-split-audit.json
          if-no-files-found: error
