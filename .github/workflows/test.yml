name: tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,all]"
      - run: python -m pytest -q
      # Keep detailed holdout predictions in a short-lived artifact, never in tracked fixtures.
      - name: Generate quarantined 24-form Korean diagnostic artifact
        if: matrix.python-version == '3.12'
        run: python scripts/diagnose-korean-ipa-holdout.py --output "$RUNNER_TEMP/clippyfirst-korean-24-form-diagnostics.json"
      - name: Upload quarantined 24-form diagnostic artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: clippyfirst-korean-24-form-holdout-diagnostics
          path: ${{ runner.temp }}/clippyfirst-korean-24-form-diagnostics.json
          if-no-files-found: error
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Verify IPA target data in a clean wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/korean-ua-wheel"
          "$RUNNER_TEMP/korean-ua-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/korean-ua-wheel/bin/python" -c "from korean_ukrainian.ipa_target_renderer import render_ipa_sequence_to_ukrainian as render; a=render('k.a'); strict=render('kʰjʌ'); b=render('kʰjʌ', allow_provisional=True); assert a['ukrainian_orthography']=='ка' and len(a['segments'])==2; assert strict['ukrainian_orthography'] is None and strict['reason']=='provisional_mapping_requires_review'; assert b['ukrainian_orthography']=='кхьо' and b['status']=='provisional'; print('wheel IPA target data OK')"
