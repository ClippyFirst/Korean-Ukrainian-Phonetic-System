name: External UGTPHON Korean IPA diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/benchmark_ugtphon_ko.py"
      - "scripts/benchmark_native_vs_g2pk_ko.py"
      - "scripts/benchmark_kozak_kim_browser.mjs"
      - "scripts/benchmark_ugtphon_ko_surface.py"
      - "tests/test_ugtphon_benchmark.py"
      - "tests/kozak-kim-ipa-first-benchmark.test.mjs"
      - "tests/test_ugtphon_surface_benchmark.py"
      - ".github/workflows/ugtphon-benchmark.yml"
      - "src/korean_ukrainian/**"
      - "src/app/engine_convert.js"
      - "data/korean/**"
      - ".github/workflows/native-vs-g2pk-benchmark.yml"

permissions:
  contents: read

jobs:
  ugtphon-korean-test:
    name: Pinned UGTPHON Korean test split
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[g2pk]"
      - name: Fetch pinned upstream data and verify license
        env:
          UGT_PHON_COMMIT: ef0d5a09c2ea1874c7206020f875cbd9cfea2f54
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/naver-ai/UGTPHON/${UGT_PHON_COMMIT}/ko/train.json" \
            --output "$RUNNER_TEMP/ko-train.json"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/naver-ai/UGTPHON/${UGT_PHON_COMMIT}/ko/test.json" \
            --output "$RUNNER_TEMP/ko-test.json"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/naver-ai/UGTPHON/${UGT_PHON_COMMIT}/ko/LICENSE" \
            --output "$RUNNER_TEMP/ko-LICENSE"
          grep -q "Apache License, Version 2.0" "$RUNNER_TEMP/ko-LICENSE"
          python - "$RUNNER_TEMP/ko-train.json" "$RUNNER_TEMP/ko-test.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          expected = {
              "train": ("771ef17ceed8127980f0be5103674cfa53627e55", 1976),
              "test": ("59380491d5a797308c475f7d0007dcf6c4be00af", 275),
          }
          for split, filename in zip(("train", "test"), sys.argv[1:]):
              data = Path(filename).read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
              rows = json.loads(data.decode("utf-8"))
              expected_sha, expected_rows = expected[split]
              assert actual == expected_sha, f"{split} pinned Git blob drift: {actual}"
              assert len(rows) == expected_rows, f"{split} row-count drift: {len(rows)}"
              assert all(row.get("lang") == "ko" and row.get("split") == split for row in rows)
              print(f"Validated pinned UGTPHON Korean {split} split: {len(rows)} rows; Git blob {actual}")
          PY
      - name: Run external IPA diagnostic
        run: |
          set -euo pipefail
          python scripts/benchmark_ugtphon_ko.py \
            --corpus "$RUNNER_TEMP/ko-test.json" \
            --output "$RUNNER_TEMP/ugtphon-ko-report.json" \
            > "$RUNNER_TEMP/benchmark-stdout.json"
          python - "$RUNNER_TEMP/ugtphon-ko-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("benchmark", "rows", "scored_tokens", "exact_matches",
                      "exact_match_rate", "character_error_rate", "unresolved_tokens",
                      "skipped_tokens", "skipped_non_hangul_or_multitoken",
                      "skipped_missing_gold", "skipped_empty_variants", "engine_errors"):
              print(f"{key}: {report.get(key)}")
          print("Diagnostic only: do not treat this score as normative accuracy or a release gate.")
          PY
      - name: Run actual browser-side Kozak Kim JavaScript engine diagnostic
        run: |
          set -euo pipefail
          node scripts/benchmark_kozak_kim_browser.mjs \
            --corpus "$RUNNER_TEMP/ko-test.json" \
            --split test \
            --output "$RUNNER_TEMP/kozak-kim-browser-test-report.json"
          python - "$RUNNER_TEMP/kozak-kim-browser-test-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("engine", "rows", "eligible_tokens", "scored_tokens", "coverage_rate",
                      "exact_matches", "exact_match_rate", "coverage_adjusted_exact_match_rate",
                      "character_error_rate", "unresolved_tokens", "partial_tokens",
                      "heuristic_tokens", "target_unavailable_tokens", "engine_errors"):
              print(f"{key}: {report.get(key)}")
          print("Direct browser-side Kozak Kim diagnostic; IPA is scored independently of Ukrainian target availability.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kozak-kim-browser-ugtphon-diagnostic
          path: |
            ${{ runner.temp }}/kozak-kim-browser-test-report.json
          if-no-files-found: warn
      - name: Run train-only raw-surface UGTPHON retrieval diagnostic
        run: |
          set -euo pipefail
          python scripts/benchmark_ugtphon_ko_surface.py \
            --train-corpus "$RUNNER_TEMP/ko-train.json" \
            --test-corpus "$RUNNER_TEMP/ko-test.json" \
            --ipa-level broad \
            --output "$RUNNER_TEMP/ugtphon-ko-raw-surface-report.json"
          python - "$RUNNER_TEMP/ugtphon-ko-raw-surface-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          r = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("attempted_tokens", "scored_tokens", "coverage_rate",
                      "exact_matches", "exact_match_rate", "coverage_adjusted_exact_match_rate",
                      "character_error_rate", "unresolved_tokens", "engine_errors"):
              print(f"normalized.{key}: {r.get(key)}")
          print("raw_baseline:", r["baseline"])
          print("paired_subset:", r["paired_subset"])
          print("normalization:", r["normalization"])
          print("Research-only train-retrieval diagnostic; canonical G2P and Ukrainian output are unchanged.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ugtphon-korean-raw-surface-diagnostic
          path: |
            ${{ runner.temp }}/ugtphon-ko-raw-surface-report.json
          if-no-files-found: warn
      - name: Run paired native-vs-g2pk comparison
        run: |
          set -euo pipefail
          python scripts/benchmark_native_vs_g2pk_ko.py \
            --corpus "$RUNNER_TEMP/ko-test.json" \
            --output "$RUNNER_TEMP/native-vs-g2pk-report.json" \
            > "$RUNNER_TEMP/native-vs-g2pk-stdout.json"
          python - "$RUNNER_TEMP/native-vs-g2pk-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          r = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("DATASET:", r["benchmark"], "rows=", r["dataset_rows"])
          for engine in ("native_engine", "g2pk"):
              m = r[engine]
              print(f"{engine}: scored={m['scored_tokens']} exact={m['exact_matches']} "
                    f"exact_rate={m['exact_match_rate']} CER={m['character_error_rate']} "
                    f"unresolved={m['unresolved_tokens']} errors={m['engine_errors']}")
          p = r["paired_subset"]
          print("PAIRED TOKENS:", p["tokens_scored_by_both"])
          print("PAIRED DELTA (g2pk - native): exact=", p["exact_match_rate_delta_g2pk_minus_native"],
                "CER=", p["cer_delta_g2pk_minus_native"])
          print("Diagnostic only; not normative accuracy or a release gate.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-vs-g2pk-ugtphon-diagnostic
          path: |
            ${{ runner.temp }}/native-vs-g2pk-report.json
            ${{ runner.temp }}/native-vs-g2pk-stdout.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ugtphon-korean-ipa-diagnostic
          path: |
            ${{ runner.temp }}/ugtphon-ko-report.json
            ${{ runner.temp }}/benchmark-stdout.json
            ${{ runner.temp }}/ko-LICENSE
          if-no-files-found: warn
