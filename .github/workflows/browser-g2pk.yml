name: Browser G2P integration
on:
  pull_request:
    paths:
      - "src/app/g2pk_web.js"
      - "src/vendor/g2pk/**"
      - "public/THIRD_PARTY_NOTICES.txt"
      - "public/LICENSES/Apache-2.0.txt"
      - "src/app/engine.js"
      - "src/app/engine_convert.js"
      - "src/main.js"
      - "index.html"
      - "system.html"
      - "data/korean/lexical_additions_2026-10-15.csv"
      - "tests/g2pk-web-engine.test.mjs"
      - "package.json"
      - ".github/workflows/browser-g2pk.yml"
  push:
    branches: [main]
    paths:
      - "src/app/g2pk_web.js"
      - "src/app/engine.js"
      - "src/app/engine_convert.js"
      - "src/main.js"
      - "data/korean/lexical_additions_2026-10-15.csv"
      - "tests/g2pk-web-engine.test.mjs"
      - "package.json"
      - ".github/workflows/browser-g2pk.yml"
  workflow_dispatch:
jobs:
  browser-g2p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npm install
      - run: npm test
      - run: npm run build
