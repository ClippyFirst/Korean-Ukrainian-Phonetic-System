name: Multi-engine Korean IPA diagnostic benchmark

on:
  workflow_dispatch:
    inputs:
      run_research_inference:
        description: "Run the CPU neural G2P inference and joined per-occurrence comparison"
        required: false
        type: boolean
        default: false
  # Documentation-only edits are checked by the repository verification workflows; do not rerun CPU G2P inference for prose changes.
  pull_request:
    paths:
      - "scripts/benchmark_multi_engine_ko.py"
      - "scripts/benchmark_phonemize_adapter.cjs"
      - "tests/test_multi_engine_benchmark.py"
      - "tests/test_sigmorphon_benchmark.py"
      - ".github/workflows/multi-engine-ipa-benchmark.yml"
      - "scripts/benchmark_ugtphon_ko.py"
      - "tests/test_ugtphon_benchmark.py"
      - "scripts/audit_v3_training_readiness.py"
      - "tests/test_v3_training_readiness.py"
      - "scripts/benchmark_charsiu_g2p.py"
      - "scripts/compare_neural_with_multiengine.py"
      - "tests/test_charsiu_g2p_benchmark.py"
      - "tests/test_contextual_g2p_benchmark.py"
      - "tests/test_compare_neural_with_multiengine.py"
      - "scripts/convert_sigmorphon_ko.py"
      - "src/korean_ukrainian/**"
      - "data/korean/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  multi-engine-ipa:
    name: Pinned multi-engine IPA comparison (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the native engine, comparison dependencies, and eSpeak NG
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes espeak-ng default-jre-headless
          python -m pip install --upgrade pip
          python -m pip install -e . "regex==2024.5.10" "phonemizer==3.3.0" "g2pk==0.9.4" "kokorog2p[ko]==0.9.15" "kiwipiepy==0.23.2" "g2p-ko @ git+https://github.com/smbslt3/g2p-korean.git@fc382a3f17e70b605b271cad8c87dd571284e5b3" "konlpy==0.6.0" "jamo==0.4.1" "pytest>=8"

      - name: Fetch pinned external implementations and verify declared licenses
        env:
          KOG2P_COMMIT: cbc69bbe1439862364d4ffd1552f59b930f655c7
          KOG2PADVANCED_COMMIT: 491b2d7269a4666b0d7556efb26755219f861163
          HAMA_COMMIT: fb81fe97e54c00b3f73192b9351f96fcd4427b03
          HANGUL_TO_IPA_COMMIT: 942abf132ea969a7e3476a1487c06710fb8db74b
        run: |
          set -euo pipefail
          git clone https://github.com/scarletcho/KoG2P.git "$RUNNER_TEMP/KoG2P"
          git -C "$RUNNER_TEMP/KoG2P" checkout --detach "$KOG2P_COMMIT"
          # KoG2Padvanced is evaluated as an external checkout only; it is not copied into this repository.
          git clone https://github.com/seongmin-mun/KoG2Padvanced.git "$RUNNER_TEMP/KoG2Padvanced"
          git -C "$RUNNER_TEMP/KoG2Padvanced" checkout --detach "$KOG2PADVANCED_COMMIT"
          git clone https://github.com/hamanlp/hama.git "$RUNNER_TEMP/hama"
          git -C "$RUNNER_TEMP/hama" checkout --detach "$HAMA_COMMIT"
          # HAMA is installed from its pinned external checkout for comparison only.
          python -m pip install "$RUNNER_TEMP/hama/python"
          git clone https://github.com/stannam/hangul_to_ipa.git "$RUNNER_TEMP/hangul_to_ipa"
          git -C "$RUNNER_TEMP/hangul_to_ipa" checkout --detach "$HANGUL_TO_IPA_COMMIT"
          grep -qi "GNU GENERAL PUBLIC LICENSE" "$RUNNER_TEMP/KoG2P/LICENSE.md"
          grep -qi "MIT License" "$RUNNER_TEMP/hangul_to_ipa/LICENSE"
          echo "KoG2P pinned commit: $(git -C "$RUNNER_TEMP/KoG2P" rev-parse HEAD) (GPL-3.0; external checkout only)"
          echo "KoG2Padvanced pinned commit: $(git -C "$RUNNER_TEMP/KoG2Padvanced" rev-parse HEAD) (no license declared upstream; comparison-only external checkout, not vendored)"
          echo "HAMA pinned commit: $(git -C "$RUNNER_TEMP/hama" rev-parse HEAD) (external checkout; LICENSE/metadata discrepancy noted in report)"
          echo "hangul_to_ipa pinned commit: $(git -C "$RUNNER_TEMP/hangul_to_ipa" rev-parse HEAD) (MIT; external checkout only)"
          echo "eSpeak NG runtime:"
          espeak-ng --version
          espeak-ng --voices=ko

      - name: Install the separately pinned JavaScript phonemizer baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phonemize-baseline"
          npm install --prefix "$RUNNER_TEMP/phonemize-baseline" --no-save phonemize@2.0.1
          node - "$RUNNER_TEMP/phonemize-baseline/node_modules/phonemize/package.json" <<'JS'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.version !== '2.0.1' || p.license !== 'MIT') {
            throw new Error('Unexpected phonemize package version/license: ' + p.version + ' / ' + p.license);
          }
          console.log('Validated phonemize@' + p.version + ' (' + p.license + ')');
          JS

      - name: Fetch and validate the pinned UGTPHON Korean test split
        env:
          UGT_PHON_COMMIT: ef0d5a09c2ea1874c7206020f875cbd9cfea2f54
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/naver-ai/UGTPHON/$UGT_PHON_COMMIT/ko/test.json" \
            --output "$RUNNER_TEMP/ko-test.json"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/naver-ai/UGTPHON/$UGT_PHON_COMMIT/ko/LICENSE" \
            --output "$RUNNER_TEMP/ko-LICENSE"
          grep -q "Apache License, Version 2.0" "$RUNNER_TEMP/ko-LICENSE"
          python - "$RUNNER_TEMP/ko-test.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert len(rows) == 275, f"pinned corpus row-count drift: {len(rows)}"
          assert all(row.get("lang") == "ko" and row.get("split") == "test" for row in rows)
          ids = [row["id"] for row in rows]
          assert len(ids) == len(set(ids)), "duplicate corpus row IDs"
          print(f"Validated pinned UGTPHON Korean test split: {len(rows)} rows; Apache-2.0")
          PY

      - name: Fetch and validate the pinned SIGMORPHON 2021 Korean test split
        env:
          SIGMORPHON_COMMIT: 821bcdece5a47820872215969f275004b0abe80c
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/sigmorphon/2021-task1/$SIGMORPHON_COMMIT/data/medium/kor_test.tsv" \
            --output "$RUNNER_TEMP/sigmorphon-kor-test.tsv"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/sigmorphon/2021-task1/$SIGMORPHON_COMMIT/README.md" \
            --output "$RUNNER_TEMP/sigmorphon-README.md"
          grep -qi "Creative Commons Attribution-ShareAlike 3.0" "$RUNNER_TEMP/sigmorphon-README.md"
          python scripts/convert_sigmorphon_ko.py \
            --input "$RUNNER_TEMP/sigmorphon-kor-test.tsv" \
            --output "$RUNNER_TEMP/sigmorphon-kor-test.json" \
            --expected-rows 1000
          python - "$RUNNER_TEMP/sigmorphon-kor-test.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert len(rows) == 1000, f"SIGMORPHON test row-count drift: {len(rows)}"
          assert all(row.get("lang") == "ko" and row.get("split") == "test" for row in rows)
          assert len({row["tokens"][0]["canonical"] for row in rows}) == 1000
          print("Validated SIGMORPHON 2021 Korean test split: 1,000 unique word/IPA pairs; CC BY-SA 3.0 data")
          PY

      - name: Run benchmark adapter tests
        run: |
          set -euo pipefail
          node --check scripts/benchmark_phonemize_adapter.cjs
          python -m pytest tests/test_multi_engine_benchmark.py tests/test_sigmorphon_benchmark.py tests/test_contextual_g2p_benchmark.py tests/test_charsiu_g2p_benchmark.py tests/test_compare_neural_with_multiengine.py tests/test_v3_training_readiness.py

      - name: Audit training readiness and frozen-holdout overlap
        run: python scripts/audit_v3_training_readiness.py --output "$RUNNER_TEMP/v3-training-readiness.json"

      - name: Run multi-engine comparison
        env:
          KOG2P_ROOT: ${{ runner.temp }}/KoG2P
          KOG2PADVANCED_ROOT: ${{ runner.temp }}/KoG2Padvanced
          HANGUL_TO_IPA_ROOT: ${{ runner.temp }}/hangul_to_ipa
          PHONEMIZE_BASELINE_DIR: ${{ runner.temp }}/phonemize-baseline
        run: |
          set -euo pipefail
          python scripts/benchmark_multi_engine_ko.py \
            --corpus "$RUNNER_TEMP/ko-test.json" \
            --output "$RUNNER_TEMP/multi-engine-ipa-report.json" \
            --kog2p-root "$KOG2P_ROOT" \
            --kog2padvanced-root "$KOG2PADVANCED_ROOT" \
            --hangul-to-ipa-root "$HANGUL_TO_IPA_ROOT" \
            --phonemize-root "$PHONEMIZE_BASELINE_DIR" \
            --phonemize-output "$RUNNER_TEMP/phonemize-predictions.json" \
            --timing-repetitions 5 \
            > "$RUNNER_TEMP/multi-engine-ipa-stdout.json"
          python - "$RUNNER_TEMP/multi-engine-ipa-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          r = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          ledger = r.get("per_engine_occurrences")
          expected = r["eligible_token_occurrences"]
          if r.get("occurrence_ledger_schema_version") != 1 or not isinstance(ledger, dict):
              raise SystemExit("baseline report lacks occurrence-ledger schema v1")
          if set(ledger) != set(r["engine_order"]):
              raise SystemExit("occurrence-ledger engine keys do not match engine_order")
          expected_ids = [str(i) for i in range(expected)]
          for engine, records in ledger.items():
              if len(records) != expected or [str(x.get("occurrence_id")) for x in records] != expected_ids:
                  raise SystemExit(f"{engine}: incomplete or unordered occurrence ledger")
              if any(not x.get("row_id") or not x.get("token") or not x.get("gold") for x in records):
                  raise SystemExit(f"{engine}: occurrence identity fields are incomplete")
              if any(x.get("status") == "scored" and not all(
                  key in x for key in ("ipa", "normalized_predicted", "exact", "distance", "reference_length")
              ) for x in records):
                  raise SystemExit(f"{engine}: scored ledger record lacks score fields")
          print("Occurrence ledger schema v1 validated for", len(ledger), "engines and", expected, "occurrences")
          print("DATASET:", r["benchmark"], "rows=", r["dataset_rows"],
                "eligible token occurrences=", r["eligible_token_occurrences"],
                "unique words=", r["unique_hangul_words"])
          for name, m in r["engines"].items():
              ci = m.get("bootstrap_95pct_ci", {}).get("exact_match_rate_95pct_ci")
              print(f"{name}: status={m['unique_word_engine_status']['status']} "
                    f"scored={m['scored_tokens']}/{m['attempted_tokens']} "
                    f"coverage={m['coverage']} exact={m['exact_matches']} "
                    f"exact_rate={m['exact_match_rate']} coverage_adjusted_exact={m['coverage_adjusted_exact_match_rate']} "
                    f"CER={m['character_error_rate']} PER={m['phoneme_error_rate']} "
                    f"feature_error_proxy={m['phonological_feature_error_rate_proxy']} "
                    f"unsupported_segments={m['unsupported_feature_segments']} "
                    f"CI95={ci} abstentions={m['abstentions_or_unresolved']} "
                    f"errors={m['engine_errors_on_token_loop']}")
              runtime = m.get("unique_word_engine_status", {}).get("runtime", {})
              print(f"  runtime_total_ms={runtime.get('total_ms')} throughput_words_s={runtime.get('throughput_words_per_second')} "
                    f"latency_p50_ms={runtime.get('per_word_latency', {}).get('p50_ms')} "
                    f"latency_p95_ms={runtime.get('per_word_latency', {}).get('p95_ms')} "
                    f"timing_scope={runtime.get('timing_scope', runtime.get('per_word_latency', {}).get('measurement_note'))}")
              repeat = runtime.get("repeatability", {})
              print(f"  repeated_runs={repeat.get('measured_repetitions')} "
                    f"repeat_median_ms={repeat.get('total_ms_median')} "
                    f"repeat_min_ms={repeat.get('total_ms_min')} repeat_max_ms={repeat.get('total_ms_max')}")
              if "paired_with_native" in m:
                  p = m["paired_with_native"]
                  ci_delta = p.get("paired_bootstrap_delta_95pct_ci", {})
                  print(f"  paired={p['paired_tokens']} delta_exact={p['exact_rate_delta_candidate_minus_native']} "
                        f"delta_CER={p['cer_delta_candidate_minus_native']} "
                        f"CI_delta_exact={ci_delta.get('exact_rate_delta_candidate_minus_native_95pct_ci')} "
                        f"CI_delta_CER={ci_delta.get('cer_delta_candidate_minus_native_95pct_ci')}")
          engines = r["engines"]
          assert "g2pk_0_9_4" in engines
          assert engines["g2pk_0_9_4"]["scored_tokens"] > 0
          pairwise_audit = r["native_g2pk_pairwise_audit"]
          assert pairwise_audit["occurrence_count"] == len(pairwise_audit["occurrences"])
          assert pairwise_audit["occurrence_count"] == r["eligible_token_occurrences"]
          assert sum(pairwise_audit["category_counts"].values()) == pairwise_audit["occurrence_count"]
          assert all(item.get("category") for item in pairwise_audit["occurrences"])
          print("ClippyFirst-vs-g2pK pairwise audit:",
                pairwise_audit["occurrence_count"], pairwise_audit["category_counts"])
          print("g2pK 0.9.4 included as an external comparison baseline; its IPA adaptation path is documented in the report.")
          print("Diagnostic only. This corpus is not normative NIKL gold and does not evaluate Ukrainian output.")
          engines = r["engines"]
          for required in ("clippyfirst_native",):
              if engines[required]["scored_tokens"] <= 0:
                  raise SystemExit(f"required baseline produced no scored tokens: {required}")
          candidates = ("g2pk_0_9_4", "KoG2P_2019", "hangul_to_ipa_2026", "espeak_ng_ko", "phonemize_2_0_1")
          usable = [name for name in candidates if engines[name]["scored_tokens"] > 0]
          if len(usable) < 2:
              raise SystemExit("fewer than two independent external candidates produced scores: " + repr(usable))
          print("Scored independent candidates:", ", ".join(usable))
          PY


      - name: Run the same pinned engine portfolio on SIGMORPHON lexical gold
        env:
          KOG2P_ROOT: ${{ runner.temp }}/KoG2P
          KOG2PADVANCED_ROOT: ${{ runner.temp }}/KoG2Padvanced
          HANGUL_TO_IPA_ROOT: ${{ runner.temp }}/hangul_to_ipa
          PHONEMIZE_BASELINE_DIR: ${{ runner.temp }}/phonemize-baseline
        run: |
          set -euo pipefail
          python scripts/benchmark_multi_engine_ko.py \
            --corpus "$RUNNER_TEMP/sigmorphon-kor-test.json" \
            --output "$RUNNER_TEMP/sigmorphon-multi-engine-ipa-report.json" \
            --benchmark-name "SIGMORPHON 2021 Korean public paired lexical test file" \
            --dataset-source "sigmorphon/2021-task1@821bcdece5a47820872215969f275004b0abe80c:data/medium/kor_test.tsv; CC BY-SA 3.0; 1,000 paired word/IPA rows; README format description differs from pinned file contents" \
            --kog2p-root "$KOG2P_ROOT" \
            --hangul-to-ipa-root "$HANGUL_TO_IPA_ROOT" \
            --phonemize-root "$PHONEMIZE_BASELINE_DIR" \
            --phonemize-output "$RUNNER_TEMP/sigmorphon-phonemize-predictions.json" \
            --kog2padvanced-root "$KOG2PADVANCED_ROOT" \
            --timing-repetitions 5 \
            > "$RUNNER_TEMP/sigmorphon-multi-engine-ipa-stdout.json"
          python - "$RUNNER_TEMP/sigmorphon-multi-engine-ipa-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          r = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          ledger = r.get("per_engine_occurrences")
          expected = r["eligible_token_occurrences"]
          if r.get("occurrence_ledger_schema_version") != 1 or not isinstance(ledger, dict):
              raise SystemExit("baseline report lacks occurrence-ledger schema v1")
          if set(ledger) != set(r["engine_order"]):
              raise SystemExit("occurrence-ledger engine keys do not match engine_order")
          expected_ids = [str(i) for i in range(expected)]
          for engine, records in ledger.items():
              if len(records) != expected or [str(x.get("occurrence_id")) for x in records] != expected_ids:
                  raise SystemExit(f"{engine}: incomplete or unordered occurrence ledger")
              if any(not x.get("row_id") or not x.get("token") or not x.get("gold") for x in records):
                  raise SystemExit(f"{engine}: occurrence identity fields are incomplete")
              if any(x.get("status") == "scored" and not all(
                  key in x for key in ("ipa", "normalized_predicted", "exact", "distance", "reference_length")
              ) for x in records):
                  raise SystemExit(f"{engine}: scored ledger record lacks score fields")
          print("Occurrence ledger schema v1 validated for", len(ledger), "engines and", expected, "occurrences")
          print("DATASET:", r["benchmark"], "rows=", r["dataset_rows"],
                "eligible token occurrences=", r["eligible_token_occurrences"],
                "unique Hangul words=", r["unique_hangul_words"])
          for name, m in r["engines"].items():
              print(f"{name}: status={m['unique_word_engine_status']['status']} "
                    f"scored={m['scored_tokens']}/{m['attempted_tokens']} "
                    f"coverage={m['coverage']} exact={m['exact_matches']} "
                    f"exact_rate={m['exact_match_rate']} coverage_adjusted_exact={m['coverage_adjusted_exact_match_rate']} "
                    f"CER={m['character_error_rate']} PER={m['phoneme_error_rate']} "
                    f"feature_error_proxy={m['phonological_feature_error_rate_proxy']} "
                    f"unsupported_segments={m['unsupported_feature_segments']} "
                    f"abstentions={m['abstentions_or_unresolved']} errors={m['engine_errors_on_token_loop']}")
              runtime = m.get("unique_word_engine_status", {}).get("runtime", {})
              print(f"  runtime_total_ms={runtime.get('total_ms')} throughput_words_s={runtime.get('throughput_words_per_second')} "
                    f"latency_p50_ms={runtime.get('per_word_latency', {}).get('p50_ms')} "
                    f"latency_p95_ms={runtime.get('per_word_latency', {}).get('p95_ms')} "
                    f"timing_scope={runtime.get('timing_scope', runtime.get('per_word_latency', {}).get('measurement_note'))}")
              if "paired_with_native" in m:
                  p = m["paired_with_native"]
                  ci_delta = p.get("paired_bootstrap_delta_95pct_ci", {})
                  print(f"  paired={p['paired_tokens']} delta_exact={p['exact_rate_delta_candidate_minus_native']} "
                        f"delta_CER={p['cer_delta_candidate_minus_native']} "
                        f"CI_delta_exact={ci_delta.get('exact_rate_delta_candidate_minus_native_95pct_ci')} "
                        f"CI_delta_CER={ci_delta.get('cer_delta_candidate_minus_native_95pct_ci')}")
          audit = r.get("native_abstention_audit", {})
          print("Native abstention audit:", audit.get("occurrence_count"), "occurrences across",
                audit.get("unique_words"), "unique words; context counts=", audit.get("context_counts"))
          print("Diagnostic lexical test only; not a normative NIKL gate and not an IPA-to-Ukrainian score.")
          engines = r["engines"]
          assert "g2pk_0_9_4" in engines
          assert engines["g2pk_0_9_4"]["scored_tokens"] > 0
          pairwise_audit = r["native_g2pk_pairwise_audit"]
          assert pairwise_audit["occurrence_count"] == len(pairwise_audit["occurrences"])
          assert pairwise_audit["occurrence_count"] == r["eligible_token_occurrences"]
          assert sum(pairwise_audit["category_counts"].values()) == pairwise_audit["occurrence_count"]
          assert all(item.get("category") for item in pairwise_audit["occurrences"])
          print("ClippyFirst-vs-g2pK pairwise audit:",
                pairwise_audit["occurrence_count"], pairwise_audit["category_counts"])
          for required in ("clippyfirst_native",):
              if engines[required]["scored_tokens"] <= 0:
                  raise SystemExit(f"required baseline produced no scored tokens: {required}")
          candidates = ("g2pk_0_9_4", "KoG2P_2019", "hangul_to_ipa_2026", "espeak_ng_ko", "phonemize_2_0_1")
          usable = [name for name in candidates if engines[name]["scored_tokens"] > 0]
          if len(usable) < 2:
              raise SystemExit("fewer than two independent external candidates produced scores: " + repr(usable))
          print("Scored independent candidates:", ", ".join(usable))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-engine-korean-ipa-diagnostic
          path: |
            ${{ runner.temp }}/multi-engine-ipa-report.json
            ${{ runner.temp }}/multi-engine-ipa-stdout.json
            ${{ runner.temp }}/phonemize-predictions.json
            ${{ runner.temp }}/ko-LICENSE
            ${{ runner.temp }}/sigmorphon-kor-test.tsv
            ${{ runner.temp }}/sigmorphon-README.md
            ${{ runner.temp }}/sigmorphon-multi-engine-ipa-report.json
            ${{ runner.temp }}/sigmorphon-multi-engine-ipa-stdout.json
            ${{ runner.temp }}/sigmorphon-phonemize-predictions.json
            ${{ runner.temp }}/v3-training-readiness.json
          if-no-files-found: warn
          retention-days: 30

  neural-korean-g2p:
    name: Pinned CharsiuG2P inference (comparative-only; no weights redistributed)
    # Explicitly enabled for the user's comparison request; checkpoint weights license remains unresolved.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_research_inference == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HOME: /home/runner/.cache/huggingface
      UGT_PHON_COMMIT: ef0d5a09c2ea1874c7206020f875cbd9cfea2f54
      SIGMORPHON_COMMIT: 821bcdece5a47820872215969f275004b0abe80c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned CPU inference and existing baseline dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.44.2" "sentencepiece==0.2.0" "huggingface_hub==0.24.6" "pytest==8.3.3"
          python -m pip install -e . "g2pk==0.9.4" "regex==2024.5.10" "phonemizer==3.3.0"

      - name: Run adapter unit tests
        run: python -m pytest tests/test_charsiu_g2p_benchmark.py tests/test_contextual_g2p_benchmark.py

      - name: Resolve immutable model and tokenizer revisions
        id: neural_revisions
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from huggingface_hub import HfApi
          api = HfApi()
          model = api.model_info("charsiu/g2p_multilingual_byT5_small_100", revision="ed5cf99")
          tokenizer = api.model_info("google/byt5-small", revision="68377bd")
          assert len(model.sha) == 40 and len(tokenizer.sha) == 40
          print("model_sha=" + model.sha)
          print("tokenizer_sha=" + tokenizer.sha)
