name: Teacher corpus split audit

on:
  pull_request:
    paths:
      - "scripts/audit_teacher_corpus_splits.py"
      - "tests/test_audit_teacher_corpus_splits.py"
      - "docs/TEACHER-CORPUS-ELIGIBILITY-2026-10-26.md"
      - ".github/workflows/teacher-corpus-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Unit-test source parsing and overlap logic
        run: python -m pytest -q tests/test_audit_teacher_corpus_splits.py
      - name: Fetch pinned public corpora and audit split integrity
        run: python scripts/audit_teacher_corpus_splits.py --output-json "$RUNNER_TEMP/teacher-corpus-split-audit.json"
      - name: Upload metadata-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: teacher-corpus-split-audit
          path: ${{ runner.temp }}/teacher-corpus-split-audit.json
          if-no-files-found: error
