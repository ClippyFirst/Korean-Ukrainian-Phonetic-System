name: Korean morphology abstention audit
on:
  pull_request:
    paths:
      - "src/korean_ukrainian/pipeline.py"
      - "src/korean_ukrainian/rules.py"
      - "src/korean_ukrainian/soft_morphology.py"
      - "scripts/benchmark_native_vs_g2pk_ko.py"
      - "scripts/benchmark_ugtphon_ko.py"
      - "tests/test_pipeline.py"
      - ".github/workflows/korean-abstention-audit.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,g2pk]"
      - name: Fetch pinned Korean UGTPHON test split
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/naver-ai/UGTPHON/ef0d5a09c2ea1874c7206020f875cbd9cfea2f54/ko/test.json" \
            --output "$RUNNER_TEMP/ko-test.json"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/naver-ai/UGTPHON/ef0d5a09c2ea1874c7206020f875cbd9cfea2f54/ko/LICENSE" \
            --output "$RUNNER_TEMP/ko-LICENSE"
          grep -q "Apache License" "$RUNNER_TEMP/ko-LICENSE"
      - name: Compare strict mode (exact licenses only)
        run: |
          python scripts/benchmark_native_vs_g2pk_ko.py \
            --corpus "$RUNNER_TEMP/ko-test.json" \
            --morphology-mode strict \
            --output "$RUNNER_TEMP/strict-abstention-audit.json" \
            > "$RUNNER_TEMP/strict-stdout.json"
      - name: Compare soft mode (heuristics remain explicitly low-confidence)
        run: |
          python scripts/benchmark_native_vs_g2pk_ko.py \
            --corpus "$RUNNER_TEMP/ko-test.json" \
            --morphology-mode soft \
            --output "$RUNNER_TEMP/soft-abstention-audit.json" \
            > "$RUNNER_TEMP/soft-stdout.json"
      - name: Print coverage and abstention comparison
        run: |
          python - "$RUNNER_TEMP/strict-abstention-audit.json" "$RUNNER_TEMP/soft-abstention-audit.json" <<'PY'
          import json, sys
          for path in sys.argv[1:]:
              report = json.load(open(path, encoding="utf-8"))
              native = report["native_engine"]
              audit = report["native_abstention_audit"]
              print(
                  f"mode={report['morphology_mode']} scored={native['scored_tokens']} "
                  f"coverage={native['coverage']} exact={native['exact_match_rate']} "
                  f"coverage_adjusted_exact={native['coverage_adjusted_exact_match_rate']} "
                  f"abstentions={audit['occurrence_count']} unique_words={audit['unique_words']} "
                  f"contexts={audit['context_counts']}"
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: korean-morphology-abstention-audit
          path: |
            ${{ runner.temp }}/strict-abstention-audit.json
            ${{ runner.temp }}/soft-abstention-audit.json
            ${{ runner.temp }}/ko-LICENSE
          if-no-files-found: error
