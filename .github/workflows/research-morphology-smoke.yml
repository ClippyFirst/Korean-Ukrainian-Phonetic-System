name: Research morphology adapter smoke

on:
  pull_request:
    paths:
      - "src/korean_ukrainian/research_morphology.py"
      - "scripts/benchmark_research_morphology.py"
      - "data/korean/morphology-review-corpus.txt"
      - "pyproject.toml"
      - "scripts/benchmark_morphology_ipa_delta.py"
      - "scripts/compare_morphology_analyzers.py"
      - "tests/test_compare_morphology_analyzers.py"
      - "tests/test_morphology_ipa_delta_benchmark.py"
      - "src/korean_ukrainian/soft_morphology.py"
      - "src/korean_ukrainian/pipeline.py"
      - "src/korean_ukrainian/rules.py"
      - ".github/workflows/research-morphology-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-smoke:
    name: ${{ matrix.engine }} real-engine smoke (Python 3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: kiwi
            extra: research-kiwi
          - engine: mecab-ko
            extra: research-mecab-ko
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and selected optional analyzer
        run: python -m pip install -e ".[${{ matrix.extra }},dev]"
      - name: Run adapter contract tests
        run: python -m pytest -q tests/test_research_morphology.py
      - name: Run real analyzer against diagnostic corpus
        run: |
          python scripts/benchmark_research_morphology.py data/korean/morphology-review-corpus.txt \
            --engines "${{ matrix.engine }}" \
            --output "artifacts/morphology-${{ matrix.engine }}.jsonl"
      - name: Validate diagnostic output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/morphology-${{ matrix.engine }}.jsonl")
          rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines()]
          assert len(rows) == 1, rows
          result = rows[0]
          assert result["status"] == "completed_diagnostic", result
          assert result["inputs"] == 16, result
          assert result["accuracy_claim"] == "none_no_gold_segmentation", result
          assert result["results"], result
          assert all(item["morphemes"] for item in result["results"]), result
          print(json.dumps({
              "engine": result["analyzer"],
              "status": result["status"],
              "inputs": result["inputs"],
              "tokens": result["tokens"],
              "elapsed_seconds": result["elapsed_seconds"],
              "accuracy_claim": result["accuracy_claim"],
          }, ensure_ascii=False))
          PY
      - name: Upload diagnostic JSONL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morphology-${{ matrix.engine }}-diagnostic
          path: artifacts/morphology-${{ matrix.engine }}.jsonl
          if-no-files-found: ignore


  paired-ipa-benchmark:
    name: ${{ matrix.engine }} + native strict/soft IPA (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: kiwi
            extra: research-kiwi
          - engine: mecab-ko
            extra: research-mecab-ko
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project, test dependencies, and selected analyzer
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extra }},dev]"
      - name: Fetch and validate the pinned UGTPHON Korean test split
        env:
          UGT_PHON_COMMIT: ef0d5a09c2ea1874c7206020f875cbd9cfea2f54
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/naver-ai/UGTPHON/$UGT_PHON_COMMIT/ko/test.json" \
            --output "$RUNNER_TEMP/ko-test.json"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/naver-ai/UGTPHON/$UGT_PHON_COMMIT/ko/LICENSE" \
            --output "$RUNNER_TEMP/ko-LICENSE"
          grep -q "Apache License, Version 2.0" "$RUNNER_TEMP/ko-LICENSE"
          python - "$RUNNER_TEMP/ko-test.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert len(rows) == 275, f"pinned corpus row-count drift: {len(rows)}"
          assert all(row.get("lang") == "ko" and row.get("split") == "test" for row in rows)
          assert len({row["id"] for row in rows}) == len(rows)
          print(f"Validated {len(rows)} pinned Korean test rows; Apache-2.0 source license.")
          PY
      - name: Run paired benchmark unit tests
        run: python -m pytest -q tests/test_morphology_ipa_delta_benchmark.py tests/test_research_morphology.py
      - name: Run same-corpus IPA and morphology comparison
        run: |
          set -euo pipefail
          python scripts/benchmark_morphology_ipa_delta.py \
            --corpus "$RUNNER_TEMP/ko-test.json" \
            --analyzer "${{ matrix.engine }}" \
            --output "artifacts/paired-ipa-morphology-${{ matrix.engine }}.json"
      - name: Validate benchmark report and print comparable deltas
        env:
          REPORT: artifacts/paired-ipa-morphology-${{ matrix.engine }}.json
          ENGINE: ${{ matrix.engine }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
          assert r["morphology"]["status"] == "completed_diagnostic", r["morphology"]
          assert r["morphology"]["unique_words_analyzed"] > 0
          assert r["native_ipa"]["strict"]["attempted_occurrences"] == r["eligible_token_occurrences"]
          assert r["native_ipa"]["soft"]["attempted_occurrences"] == r["eligible_token_occurrences"]
          assert r["native_ipa"]["paired_subset"]["occurrences_scored_by_both"] > 0
          gated = r["native_ipa"]["boundary_gated_by_analyzer"]
          assert gated["status"] == "counterfactual_research_only", gated
          assert gated["attempted_occurrences"] == r["eligible_token_occurrences"], gated
          assert "not be used in production" in gated["interpretation"], gated
          paired = gated["paired_comparison"]
          assert paired["scored_occurrences_by_all_three"] > 0, paired
          for comparison in ("boundary_gated_vs_strict", "boundary_gated_vs_soft", "soft_vs_strict"):
              pair = paired[comparison]
              assert pair["baseline_metrics"]["scored_occurrences"] == paired["scored_occurrences_by_all_three"], pair
              assert pair["candidate_metrics"]["scored_occurrences"] == paired["scored_occurrences_by_all_three"], pair
              assert pair["baseline_metrics"]["reference_characters"] == pair["candidate_metrics"]["reference_characters"], pair
          alignment = r["morphology"]["native_soft_rule_boundary_alignment"]
          assert alignment["events"] == alignment["boundary_observed"] + alignment["boundary_not_observed"], alignment
          print(json.dumps({
            "engine": os.environ["ENGINE"],
            "dataset_rows": r["dataset_rows"],
            "eligible_occurrences": r["eligible_token_occurrences"],
            "unique_words": r["unique_hangul_words"],
            "strict": r["native_ipa"]["strict"],
            "soft": r["native_ipa"]["soft"],
            "strict_soft_paired_delta": r["native_ipa"]["paired_subset"],
            "boundary_gated_counterfactual": {
              k:v for k,v in gated.items()
              if k not in {"changed_examples_vs_strict", "runtime_error_examples"}
            },
            "paired_three_way_comparison": paired,
            "rule_boundary_alignment": {k:v for k,v in alignment.items() if k != "events_detail"},
            "morphology": {k:v for k,v in r["morphology"].items()
                           if k not in {"results","errors","tag_counts_top_50","native_soft_rule_boundary_alignment"}},
            "changed_words": r["native_ipa"]["unique_words_with_changed_ipa_or_status"],
            "changed_words_also_split": r["native_ipa"]["changed_words_with_multi_morpheme_segmentation"],
          }, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-ipa-morphology-${{ matrix.engine }}
          path: |
            artifacts/paired-ipa-morphology-${{ matrix.engine }}.json
            ${{ runner.temp }}/ko-LICENSE
          if-no-files-found: warn
          retention-days: 30


  analyzer-agreement:
    name: Kiwi vs MeCab-Ko boundary agreement
    runs-on: ubuntu-24.04
    needs: paired-ipa-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download both same-corpus analyzer reports
        uses: actions/download-artifact@v4
        with:
          pattern: paired-ipa-morphology-*
          merge-multiple: true
          path: artifacts/morphology
      - name: Compare boundary agreement, not gold accuracy
        run: |
          set -euo pipefail
          find artifacts/morphology -type f -print
          KIWI_REPORT="$(find artifacts/morphology -type f -name 'paired-ipa-morphology-kiwi.json' -print -quit)"
          MECAB_REPORT="$(find artifacts/morphology -type f -name 'paired-ipa-morphology-mecab-ko.json' -print -quit)"
          test -n "$KIWI_REPORT"
          test -n "$MECAB_REPORT"
          python scripts/compare_morphology_analyzers.py \
            --kiwi "$KIWI_REPORT" \
            --mecab-ko "$MECAB_REPORT" \
            --output artifacts/morphology/analyzer-boundary-agreement.json
      - name: Upload pairwise agreement report
        uses: actions/upload-artifact@v4
        with:
          name: morphology-analyzer-boundary-agreement
          path: artifacts/morphology/analyzer-boundary-agreement.json
          retention-days: 30
