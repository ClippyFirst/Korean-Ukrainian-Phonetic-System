name: NIKL local HTML source inventory

on:
  push:
    branches: ["main", "research/nikl-local-html-import-2026-10-24"]
    paths:
      - "한국어 어문 규범.htm"
      - "scripts/nikl-norm-crawler.mjs"
      - "schemas/nikl-source-manifest.schema.json"
      - "reports/nikl/standard-pronunciation-manifest.json"
      - ".github/workflows/nikl-local-html-inventory.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "한국어 어문 규범.htm"
      - "scripts/nikl-norm-crawler.mjs"
      - "schemas/nikl-source-manifest.schema.json"
      - "reports/nikl/standard-pronunciation-manifest.json"
      - ".github/workflows/nikl-local-html-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import repository-held HTML as metadata only
        run: >-
          node scripts/nikl-norm-crawler.mjs
          --url "https://www.korean.go.kr/kornorms/regltn/regltnView.do?regltn_code=0002"
          --input-html "한국어 어문 규범.htm"
          --output "/tmp/nikl-standard-pronunciation-manifest.json"

      - name: Emit regenerated metadata manifest for review
        run: |
          echo "NIKL_MANIFEST_BASE64_BEGIN"
          base64 -w0 /tmp/nikl-standard-pronunciation-manifest.json
          echo
          echo "NIKL_MANIFEST_BASE64_END"

      - name: Validate schema, provenance, and reproducibility
        run: |
          python -m pip install jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path("schemas/nikl-source-manifest.schema.json").read_text(encoding="utf-8"))
          committed = json.loads(Path("reports/nikl/standard-pronunciation-manifest.json").read_text(encoding="utf-8"))
          generated = json.loads(Path("/tmp/nikl-standard-pronunciation-manifest.json").read_text(encoding="utf-8"))

          Draft202012Validator(schema, format_checker=FormatChecker()).validate(committed)
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(generated)

          assert committed["inventory"]["complete"] is True
          assert committed["inventory"]["expectedCount"] == committed["inventory"]["extractedCount"] == 30
          assert not any(committed["inventory"][key] for key in ("missing", "duplicates", "unexpected", "incomplete", "errors"))
          assert committed["source"]["retrievalMode"] == "local-html-import"
          assert committed["source"]["httpStatus"] is None
          assert committed["source"]["retrievedAt"] is None
          assert committed["source"]["robots"]["decision"] == "not_checked_local_import"
          assert committed["source"]["termsReview"] == "not_assessed"
          assert all("sourceText" not in article for article in committed["articles"])

          # Import time naturally changes on every run; every other field must reproduce exactly.
          generated["source"]["importedAt"] = committed["source"]["importedAt"]
          assert generated == committed, "generated inventory differs from committed manifest"
          print("NIKL manifest schema: PASS")
          print("NIKL inventory: 30/30; missing=0; duplicates=0; unexpected=0; incomplete=0")
          print("NIKL source SHA-256: " + committed["source"]["responseSha256"])
          print("NIKL provenance: local-html-import; HTTP/robots/terms checks explicitly unclaimed")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nikl-local-html-metadata-manifest
          path: reports/nikl/standard-pronunciation-manifest.json
          if-no-files-found: error
          retention-days: 30
