name: Exhaustive test-case register extraction

on:
  pull_request:
    paths:
      - "scripts/build_test_case_register.py"
      - "tests/test_build_test_case_register.py"
      - "scripts/classify_test_case_candidates.py"
      - "tests/test_classify_test_case_candidates.py"
      - "data/korean/**"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/test-case-register.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test extractor behavior
        run: python -m pip install pytest && python -m pytest -q tests/test_build_test_case_register.py tests/test_classify_test_case_candidates.py
      - name: Generate loss-preserving inventories
        run: |
          set -euo pipefail
          python scripts/build_test_case_register.py --output-dir "$RUNNER_TEMP/case-register"
          python scripts/classify_test_case_candidates.py --input "$RUNNER_TEMP/case-register/TEST-CASE-REGISTER-ASSERTION-CANDIDATES-2026-10-26.csv" --output "$RUNNER_TEMP/case-register/TEST-CASE-REGISTER-ASSERTION-CLASSIFICATION-QUEUE-2026-10-27.csv"
          python - "$RUNNER_TEMP/case-register" "$GITHUB_SHA" <<'PY'
          import csv, hashlib, json, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          commit = sys.argv[2]
          expected = {
              "TEST-CASE-REGISTER-LEXICAL-BASE-2026-10-26.csv": "case_id",
              "TEST-CASE-REGISTER-LEXICAL-TEST-LINKS-2026-10-26.csv": "link_id",
              "TEST-CASE-REGISTER-HANGUL-LITERAL-CANDIDATES-2026-10-26.csv": "candidate_id",
              "TEST-CASE-REGISTER-SOURCE-LINES-2026-10-26.csv": "line_id",
              "TEST-CASE-REGISTER-ASSERTION-CANDIDATES-2026-10-26.csv": "assertion_candidate_id",
              "TEST-CASE-REGISTER-ASSERTION-CLASSIFICATION-QUEUE-2026-10-27.csv": "queue_id",
          }
          report = {"commit": commit, "files": {}}
          for name, id_column in expected.items():
              path = root / name
              with path.open(encoding="utf-8", newline="") as stream:
                  reader = csv.DictReader(stream)
                  columns = reader.fieldnames
                  rows = list(reader)
              assert columns and id_column in columns, (name, columns)
              ids = [row[id_column] for row in rows]
              assert all(ids), (name, "blank stable ID")
              assert len(ids) == len(set(ids)), (name, "duplicate stable ID")
              report["files"][name] = {
                  "rows": len(rows),
                  "columns": len(columns),
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          (root / "TEST-CASE-REGISTER-EXTRACTION-REPORT.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exhaustive-test-case-register-${{ github.sha }}
          path: ${{ runner.temp }}/case-register/
          if-no-files-found: error
          retention-days: 30
