[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="korean-ukrainian-phonetic-system"
version="0.6.0"
requires-python=">=3.11"
dependencies=[]
scripts={korean-ua="korean_ukrainian.cli:main"}

[project.optional-dependencies]
dev=["pytest>=8","jsonschema>=4"]
cli=["openpyxl>=3.1"]
api=["fastapi>=0.115","uvicorn>=0.30"]
all=["openpyxl>=3.1","fastapi>=0.115","uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"

[tool.setuptools.packages.find]
where=["src"]

[tool.setuptools.data-files]
"share/korean-ukrainian-phonetic-system" = ["data/korean/lexical_pronunciations.csv"]
